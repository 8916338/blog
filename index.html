<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一个简洁优雅的微博模板 - 支持 Markdown 渲染、多页面、PWA">
    <title>微言 - 极简微博模板</title>
    <link rel="manifest" href="./public/manifest.json">
    <link rel="stylesheet" href="./public/css/main.css">
    <link rel="icon" href="./public/images/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <header class="navbar" id="navbar"></header>

        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- 主内容区 -->
        <main class="main-content" id="main-content">
            <div class="page-loader" id="page-loader">
                <div class="loader-spinner"></div>
                <p>加载中...</p>
            </div>
        </main>

        <!-- 页脚 -->
        <footer class="footer" id="footer"></footer>
    </div>

    <!-- Markdown 渲染弹窗 -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title">阅读全文</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="./public/js/utils.js"></script>
    <script src="./public/js/components.js"></script>
    <script src="./public/js/router.js"></script>
    <script src="./public/js/markdown.js"></script>
    <script src="./public/js/app.js"></script>
</body>
</html>
