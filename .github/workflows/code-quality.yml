name: Code Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: 📊 Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint

      - name: 📏 File size check
        run: |
          echo "## 📏 文件大小报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 文件 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find public/ -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" \) -exec ls -lh {} \; | \
          awk '{printf "| %s | %s |\n", $9, $5}' >> $GITHUB_STEP_SUMMARY

      - name: 🔢 Count lines of code
        run: |
          echo "## 🔢 代码行数统计" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find . -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" \) \
            ! -path "./node_modules/*" ! -path "./build/*" ! -path "./.git/*" \
            -exec wc -l {} + | tail -1 | \
            awk '{print "**总代码行数:** "$1}' >> $GITHUB_STEP_SUMMARY

      - name: 🌳 Check for large files
        run: |
          LARGE_FILES=$(find . -type f ! -path "./.git/*" ! -path "./node_modules/*" ! -path "./build/*" -size +500k)
          if [ -n "$LARGE_FILES" ]; then
            echo "⚠️ 发现超过 500KB 的文件：" >> $GITHUB_STEP_SUMMARY
            echo "$LARGE_FILES" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ 没有发现过大的文件" >> $GITHUB_STEP_SUMMARY
          fi
