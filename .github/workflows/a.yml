name: Extract archive to repo root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and extract archive
        env:
          ARCHIVE_URL: "https://mpimg.cn/down.php/5b39cdd2f1881400f7366b2c7945d8a3.zip"
        run: |
          set -e
          mkdir -p /tmp/archive
          curl -L "$ARCHIVE_URL" -o /tmp/archive/archive
          cd /tmp/archive
          file archive
          if file archive | grep -qi 'gzip'; then
            tar -xzf archive
          elif file archive | grep -qi 'zip'; then
            unzip -o archive
          elif file archive | grep -qi 'tar'; then
            tar -xf archive
          else
            echo "未知压缩格式"; exit 1
          fi
          # 把解压出的内容复制到仓库根目录
          rsync -a --exclude='archive' /tmp/archive/ "$GITHUB_WORKSPACE/"

      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "Extract archive to repo root"
            git push
          fi