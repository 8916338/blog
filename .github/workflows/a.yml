name: Download and Extract ZIP

on:
  workflow_dispatch:

jobs:
  download-and-extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 下载 ZIP 文件
        run: |
          curl -L -o package.zip \
            "https://mpimg.cn/down.php/5b39cdd2f1881400f7366b2c7945d8a3.zip"

      - name: 解压 ZIP 到仓库根目录（排除 workflows）
        run: |
          unzip -o package.zip -d . -x ".github/workflows/*"
          rm package.zip

      - name: 提交并推送更改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动解压并更新文件"